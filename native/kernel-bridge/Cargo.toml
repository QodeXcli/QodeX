[package]
name = "rea-kernel-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8", "async", "tokio_rt", "serde-json"] }
napi-derive = "2.16"
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "time", "macros"] }
parking_lot = "0.12"
goblin = "0.8"
scroll = "0.12"
libc = "0.2"
thiserror = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security"
] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.12"
nix = { version = "0.29", features = ["uio", "process", "ioctl"] }

[build-dependencies]
napi-build = "2.1"
