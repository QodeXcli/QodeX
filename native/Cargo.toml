[package]
name = "qodex-desktop"
version = "2.31.0"
edition = "2021"
description = "Native OS window for the QodeX desktop shell. Loopback only."
publish = false

[dependencies]
eframe = "0.31"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
